[package]
name = "infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["updater", "sync"]
# Mises à jour depuis GitHub : installation automatique (ordinateur) ou
# simple avis (Android installé par l'APK ; le Play Store gère les siennes).
updater = ["dep:ureq"]
# Synchronisation entre appareils par le relais en ligne (`crates/relay`).
sync = ["dep:ureq", "dep:getrandom"]

[dependencies]
domain = { path = "../domain" }
application = { path = "../application" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ureq = { version = "2", optional = true }
sha2 = "0.10"
getrandom = { version = "0.2", optional = true }
