[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/presentation",
    "crates/bin",
    "crates/android",
    "crates/uniffi-bindgen",
    "crates/relay",
]

[workspace.package]
version = "0.24.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Bibliothèque Android : optimisée pour la taille (APK plus léger). Une panique
# arrête l'app tout de suite (elle la faisait planter de toute façon).
[profile.android]
inherits = "release"
opt-level = "s"
panic = "abort"
