[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/presentation",
    "crates/bin",
    "crates/android",
    "crates/uniffi-bindgen",
    "crates/relay",
]

[workspace.package]
version = "0.19.2"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
