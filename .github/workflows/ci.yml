name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: format + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

  architecture:
    name: règles d'architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: domain n'a aucune dépendance
        run: |
          deps=$(sed -n '/^\[dependencies\]/,/^\[/p' crates/domain/Cargo.toml | grep -Ev '^\[|^#|^\s*$' || true)
          if [ -n "$deps" ]; then echo "::error::domain a des dépendances : $deps"; exit 1; fi
      - name: application ne dépend que de domain
        run: |
          deps=$(sed -n '/^\[dependencies\]/,/^\[/p' crates/application/Cargo.toml | grep -Ev '^\[|^#|^\s*$|^domain' || true)
          if [ -n "$deps" ]; then echo "::error::application dépend de : $deps"; exit 1; fi
      - name: ratatui/crossterm seulement dans presentation
        run: |
          hits=$(grep -rlE 'ratatui|crossterm' crates --include='*.rs' --include=Cargo.toml | grep -v '^crates/presentation/' || true)
          if [ -n "$hits" ]; then echo "::error::$hits"; exit 1; fi
      - name: serde/std::fs seulement dans infrastructure
        run: |
          hits=$(grep -rlE 'serde|std::fs' crates --include='*.rs' --include=Cargo.toml | grep -v '^crates/infrastructure/' || true)
          if [ -n "$hits" ]; then echo "::error::$hits"; exit 1; fi

  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build release
        run: cargo build --release --locked

  docker:
    name: image docker (build seulement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
