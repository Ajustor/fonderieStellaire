name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: format + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: ALSA (sons du jeu sous Linux)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

  architecture:
    name: règles d'architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: domain n'a aucune dépendance
        run: |
          deps=$(sed -n '/^\[dependencies\]/,/^\[/p' crates/domain/Cargo.toml | grep -Ev '^\[|^#|^\s*$' || true)
          if [ -n "$deps" ]; then echo "::error::domain a des dépendances : $deps"; exit 1; fi
      - name: application ne dépend que de domain
        run: |
          deps=$(sed -n '/^\[dependencies\]/,/^\[/p' crates/application/Cargo.toml | grep -Ev '^\[|^#|^\s*$|^domain' || true)
          if [ -n "$deps" ]; then echo "::error::application dépend de : $deps"; exit 1; fi
      - name: ratatui/crossterm seulement dans presentation
        run: |
          hits=$(grep -rlE 'ratatui|crossterm' crates --include='*.rs' --include=Cargo.toml | grep -v '^crates/presentation/' || true)
          if [ -n "$hits" ]; then echo "::error::$hits"; exit 1; fi
      # Le relais (crates/relay) est un serveur à part, hors des couches du jeu.
      - name: serde/std::fs seulement dans infrastructure
        run: |
          hits=$(grep -rlE 'serde|std::fs' crates --include='*.rs' --include=Cargo.toml | grep -Ev '^crates/(infrastructure|relay)/' || true)
          if [ -n "$hits" ]; then echo "::error::$hits"; exit 1; fi
      # Une erreur de syntaxe casse toute la page sans bruit (classement vide).
      - name: scripts du site sans erreur de syntaxe
        run: |
          for page in crates/relay/src/*.html; do
            js="${RUNNER_TEMP}/$(basename "$page" .html).js"
            python3 -c "import re,sys; print('\n'.join(re.findall(r'<script>(.*?)</script>', open(sys.argv[1]).read(), re.S)))" "$page" > "$js"
            node --check "$js" || { echo "::error file=$page::erreur de syntaxe JavaScript"; exit 1; }
          done

  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ALSA (sons du jeu sous Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build release
        run: cargo build --release --locked

  docker:
    name: image docker (build seulement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
