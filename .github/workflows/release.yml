name: release

# Pousser un tag v* (ex. `git tag v0.1.0 && git push origin v0.1.0`) :
#  1. vérifie et compile les binaires Windows et Linux,
#  2. publie une GitHub Release avec les archives et leurs sommes SHA-256,
#  3. publie l'image Docker sur GitHub Container Registry (ghcr.io).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: fonderie-stellaire-x86_64-pc-windows-msvc.zip
            binary: fonderie-stellaire.exe
          # Ubuntu 22.04 : glibc plus ancienne → binaire compatible avec plus de distributions.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: fonderie-stellaire-x86_64-unknown-linux-gnu.tar.gz
            binary: fonderie-stellaire
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "target/${{ matrix.target }}/release"
          Copy-Item README.md $dir/
          Compress-Archive -Path "$dir/${{ matrix.binary }}", "$dir/README.md" -DestinationPath ${{ matrix.archive }}
          (Get-FileHash ${{ matrix.archive }} -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.archive }}" | Out-File -Encoding ascii "${{ matrix.archive }}.sha256"

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          dir="target/${{ matrix.target }}/release"
          cp README.md "$dir/"
          tar -czf ${{ matrix.archive }} -C "$dir" ${{ matrix.binary }} README.md
          sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  github-release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Fonderie Stellaire ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*

  docker:
    name: image ghcr.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
