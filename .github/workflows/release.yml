name: release

# Pousser un tag v* (ex. `git tag v0.1.0 && git push origin v0.1.0`) :
#  1. vérifie et compile les binaires Windows, Linux et macOS,
#  2. publie une GitHub Release avec les archives et leurs sommes SHA-256,
#  3. publie l'image Docker sur GitHub Container Registry (ghcr.io).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: fonderie-stellaire-x86_64-pc-windows-msvc.zip
            raw: fonderie-stellaire-x86_64-pc-windows-msvc.exe
            binary: fonderie-stellaire.exe
          # Ubuntu 22.04 : glibc plus ancienne → binaire compatible avec plus de distributions.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: fonderie-stellaire-x86_64-unknown-linux-gnu.tar.gz
            raw: fonderie-stellaire-x86_64-unknown-linux-gnu
            binary: fonderie-stellaire
          # macOS : Intel (compilé de façon croisée) et Apple Silicon.
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: fonderie-stellaire-x86_64-apple-darwin.tar.gz
            raw: fonderie-stellaire-x86_64-apple-darwin
            binary: fonderie-stellaire
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: fonderie-stellaire-aarch64-apple-darwin.tar.gz
            raw: fonderie-stellaire-aarch64-apple-darwin
            binary: fonderie-stellaire
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          # Numéro de version affiché et comparé par la mise à jour automatique.
          FONDERIE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          # Clé de chiffrement des sauvegardes (secret du dépôt, jamais dans le code).
          FONDERIE_SAVE_KEY: ${{ secrets.FONDERIE_SAVE_KEY }}
          # Clé de signature des fiches du classement (= LEADERBOARD_KEY du relais).
          FONDERIE_LEADERBOARD_KEY: ${{ secrets.FONDERIE_LEADERBOARD_KEY }}
          # Autre relais de synchronisation (variable du dépôt, facultative).
          FONDERIE_SYNC_URL: ${{ vars.FONDERIE_SYNC_URL }}

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "target/${{ matrix.target }}/release"
          Copy-Item README.md $dir/
          Compress-Archive -Path "$dir/${{ matrix.binary }}", "$dir/README.md" -DestinationPath ${{ matrix.archive }}
          # Binaire brut : utilisé par la mise à jour automatique.
          Copy-Item "$dir/${{ matrix.binary }}" "${{ matrix.raw }}"
          foreach ($f in @("${{ matrix.archive }}", "${{ matrix.raw }}")) {
            (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() + "  $f" | Out-File -Encoding ascii "$f.sha256"
          }

      - name: Archive (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          dir="target/${{ matrix.target }}/release"
          cp README.md "$dir/"
          tar -czf ${{ matrix.archive }} -C "$dir" ${{ matrix.binary }} README.md
          # Binaire brut : utilisé par la mise à jour automatique.
          cp "$dir/${{ matrix.binary }}" "${{ matrix.raw }}"
          for f in "${{ matrix.archive }}" "${{ matrix.raw }}"; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
            ${{ matrix.raw }}
            ${{ matrix.raw }}.sha256

  github-release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notes de version (section du CHANGELOG)
        run: |
          # Titre « ## v0.17.1 » ou « ## v0.17.1 — sous-titre ».
          awk -v tag="## ${GITHUB_REF_NAME}" '
            $0 == tag || index($0, tag " ") == 1 { keep = 1; next }
            /^## / && keep { exit }
            keep { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Voir CHANGELOG.md." > notes.md; fi
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Fonderie Stellaire ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*

  docker:
    name: image ghcr.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Clés des sauvegardes et du classement : secrets BuildKit, absents de
          # l'historique de l'image.
          secrets: |
            save_key=${{ secrets.FONDERIE_SAVE_KEY }}
            leaderboard_key=${{ secrets.FONDERIE_LEADERBOARD_KEY }}
          build-args: |
            FONDERIE_SYNC_URL=${{ vars.FONDERIE_SYNC_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
