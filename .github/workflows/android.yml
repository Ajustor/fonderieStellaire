name: android

# Compile l'application Android (APK + AAB signés) :
#  - à chaque push sur master ou chore/android, et sur les pull requests : artefacts ;
#  - sur un tag v* : APK attaché à la GitHub Release, AAB envoyé sur le Play Store
#    (piste interne) si le secret PLAY_SERVICE_ACCOUNT_JSON est défini.

on:
  push:
    branches: [master, chore/android]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 29.0.14206865

jobs:
  build:
    name: APK + AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null

      - name: Clé de signature
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: android
        env:
          FONDERIE_SAVE_KEY: ${{ secrets.FONDERIE_SAVE_KEY }}
          FONDERIE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Renommage
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/fonderie-stellaire.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/fonderie-stellaire.aab
          (cd dist && sha256sum fonderie-stellaire.apk > fonderie-stellaire.apk.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

      - name: APK dans la GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fonderie-stellaire.apk
            dist/fonderie-stellaire.apk.sha256

      - name: Compte de service Play Store configuré ?
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "enabled=$([ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Play Store (piste interne)
        if: startsWith(github.ref, 'refs/tags/v') && steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ajustor.fonderie
          releaseFiles: dist/fonderie-stellaire.aab
          track: internal
          status: completed
